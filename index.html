<!DOCTYPE html>
<html>
<head>
  <title>SVG Test</title>
</head>

<body>

<h2>SVG Loading Test</h2>

<div id="status">Loading...</div>

<div id="svgContainer"></div>

<script>
fetch("parrot-colouring.svg")
  .then(res => {
      if (!res.ok) {
          throw new Error("File not found or wrong path");
      }
      return res.text();
  })
  .then(data => {
      document.getElementById("status").innerHTML = "✅ SVG Loaded Successfully";
      document.getElementById("svgContainer").innerHTML = data;
  })
  .catch(err => {
      document.getElementById("status").innerHTML =
      "❌ ERROR: SVG not loading";
      console.log(err);
  });
</script>

</body>
</html>
