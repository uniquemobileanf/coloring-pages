<!DOCTYPE html>
<html>
<head>
  <title>SVG Coloring Page</title>

  <style>
    body {
      text-align: center;
      font-family: Arial;
    }

    svg path, svg circle, svg rect, svg polygon {
      cursor: pointer;
      transition: 0.2s;
    }
  </style>
</head>

<body>

<h2>Color Your Parrot 🎨</h2>

<label>Pick Color: </label>
<input type="color" id="colorPicker" value="#ff0000">

<br><br>

<div id="svgContainer">Loading SVG...</div>

<script>
let selectedColor = "#ff0000";

// color picker
document.getElementById("colorPicker").addEventListener("input", function(e) {
    selectedColor = e.target.value;
});

// load your SVG file
fetch("parrot-colouring.svg")
  .then(res => res.text())
  .then(data => {
      document.getElementById("svgContainer").innerHTML = data;

      // make shapes clickable
      document.querySelectorAll("svg path, svg circle, svg rect, svg polygon")
      .forEach(el => {
          el.addEventListener("click", function () {
              this.setAttribute("fill", selectedColor);
          });
      });
  })
  .catch(err => {
      document.getElementById("svgContainer").innerHTML =
      "❌ SVG not loading. Check file name or upload location.";
      console.log(err);
  });
</script>

</body>
</html>
